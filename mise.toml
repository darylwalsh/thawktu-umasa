[tools]
python = "3.15.2"
uv = "0.13.7"

[settings]
python.uv_venv_auto = "source"

[env]
# Bind uv to mise's installation even when another Python is on PATH.
UV_PYTHON = { value = "{{ tools.python.path }}/bin/python", tools = true }
UV_PYTHON_DOWNLOADS = "never"

[tasks.setup]
description = "Install locked Python dependencies"
run = "uv sync --locked"

[tasks.run]
description = "Print the starter package name and version"
run = "uv run python -m python_starter"
