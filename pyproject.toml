[project]
name = "python-starter"
version = "0.1.0"
description = "A Python starter with reproducible tooling and quality guardrails"
readme = "README.md"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
  "pydantic>=2.14.3,<3",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py315"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
  "S101", # Pytest assertions are the test contract.
  "S603", # CLI tests invoke the current interpreter with fixed module arguments.
]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.15"
venvPath = "."
venv = ".venv"
reportUnnecessaryTypeIgnoreComment = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config", "--disable-socket", "--cov=src"]
filterwarnings = ["error"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true

[dependency-groups]
dev = [
  "pyright[nodejs]==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-socket==0.8.1",
  "ruff==0.17.4",
]
